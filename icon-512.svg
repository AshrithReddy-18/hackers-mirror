<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#050a0f"/>
  <!-- grid lines -->
  <line x1="0" y1="128" x2="512" y2="128" stroke="#00ff88" stroke-width="1" opacity="0.12"/>
  <line x1="0" y1="256" x2="512" y2="256" stroke="#00ff88" stroke-width="1" opacity="0.12"/>
  <line x1="0" y1="384" x2="512" y2="384" stroke="#00ff88" stroke-width="1" opacity="0.12"/>
  <line x1="128" y1="0" x2="128" y2="512" stroke="#00ff88" stroke-width="1" opacity="0.12"/>
  <line x1="256" y1="0" x2="256" y2="512" stroke="#00ff88" stroke-width="1" opacity="0.12"/>
  <line x1="384" y1="0" x2="384" y2="512" stroke="#00ff88" stroke-width="1" opacity="0.12"/>
  <!-- outer glow ring -->
  <circle cx="256" cy="220" r="140" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.15"/>
  <!-- M lettermark -->
  <text x="256" y="300" font-family="Georgia, serif" font-size="230" font-weight="bold"
        fill="none" stroke="#00ff88" stroke-width="6"
        text-anchor="middle" letter-spacing="-8">M</text>
  <!-- glow dot bottom -->
  <circle cx="256" cy="390" r="12" fill="#00ff88" opacity="0.85"/>
  <!-- scan lines bottom -->
  <rect x="60" y="420" width="392" height="3" rx="1.5" fill="#00ff88" opacity="0.25"/>
  <rect x="100" y="430" width="312" height="2" rx="1" fill="#00ff88" opacity="0.12"/>
</svg>
